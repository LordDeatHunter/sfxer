[project]
name = "sfxer-judge"
version = "0.1.0"
description = "Semantic check for sfxer renders: CLAP text match + AudioSet labels"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.5.1",
  "transformers==4.48.1",
  "numpy<2.3",
  "soundfile>=0.12",
  "soxr>=0.5",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
